<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turno de estudio</title>
<meta name="theme-color" content="#141c18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Plan: el lenguaje visual de la prevención de riesgos. Colores de señalética de seguridad (NCh 1411 / ISO 7010):
   verde = primeros auxilios y condición segura, azul = obligación, rojo = emergencia, amarillo = advertencia.
   Cada ramo lleva su señal; las entregas se leen como una matriz de riesgo; las misiones son órdenes de trabajo
   y cada una termina en una tarjeta de inspección aprobada. Cinta de peligro amarilla y negra como firma. */
:root{
  --bg:#e7eae6; --surface:#ffffff; --surface2:#f1f3ef; --ink:#121615; --muted:#55615c; --line:#cfd5d0;
  --yellow:#f6c700; --verde:#00843d; --azul:#0057a8; --rojo:#c8102e; --naranjo:#e8590c;
  --ok:#00843d; --ok-soft:#dbefe2; --bad:#c8102e; --bad-soft:#f9dfe2;
  --panel:#15191b; --panel2:#1e2427; --panel-ink:#eef2ef; --panel-muted:#9aa8a2;
  --c:#00843d;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 0 rgba(18,22,21,.06),0 10px 26px -16px rgba(18,22,21,.45);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f10; --surface:#151a1c; --surface2:#1b2124; --ink:#e8eeeb; --muted:#99a7a1; --line:#2a3337;
    --ok:#2fbf71; --ok-soft:#14321f; --bad:#ff6b6b; --bad-soft:#3a1719; --panel:#080a0b; --panel2:#12171a;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.85); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f10; --surface:#151a1c; --surface2:#1b2124; --ink:#e8eeeb; --muted:#99a7a1; --line:#2a3337;
  --ok:#2fbf71; --ok-soft:#14321f; --bad:#ff6b6b; --bad-soft:#3a1719; --panel:#080a0b; --panel2:#12171a;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.85); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.02;margin:0;text-wrap:balance}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.tape{height:14px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,#111 14px 28px)}

/* ---------- Cabecera: credencial del prevencionista ---------- */
.top{background:var(--panel);color:var(--panel-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 18px}
.top .in{max-width:860px;margin:0 auto;display:grid;gap:14px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand .k{font-family:var(--display);font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:13px;color:var(--yellow)}
.brand h1{font-size:46px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}
.brand h1 span{color:var(--yellow)}
.stats{display:flex;gap:18px;align-items:center}
.stat{display:grid;line-height:1;justify-items:start}
.stat b{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--panel-muted);margin-top:4px}
.stat.fire b{color:var(--yellow)}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.helmet{width:44px;height:44px}
.lvl .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--panel-muted);flex-wrap:wrap}
.lvl .row strong{color:var(--panel-ink);font-family:var(--display);font-size:19px;letter-spacing:1px;text-transform:uppercase}
.lvlbar{height:8px;background:#2a3236;border-radius:6px;overflow:hidden;margin-top:6px}
.lvlbar i{display:block;height:100%;width:0;background:var(--yellow);border-radius:6px;transition:width .6s}
.clockline{font-family:var(--display);letter-spacing:2px;text-transform:uppercase;font-size:14px;color:var(--panel-muted)}
.clockline b{color:var(--panel-ink);font-size:16px;font-variant-numeric:tabular-nums}

section.block{margin-top:28px;display:grid;gap:12px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sh h2{font-size:21px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.sh span{font-size:14px;color:var(--muted)}
.sign{flex:none;display:inline-grid;place-items:center}
.sign svg{display:block}

/* ---------- Aviso fijo de entrega crítica ---------- */
.alarm{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;background:var(--rojo);color:#fff;display:flex;gap:12px;align-items:center;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.alarm.alto{background:var(--naranjo)}
.alarm p{margin:0;flex:1;min-width:0;font-size:15px;line-height:1.3}
.alarm p b{font-family:var(--display);font-size:20px;letter-spacing:.5px;text-transform:uppercase;display:block}
.alarm .btn{background:#fff;color:#111;padding:8px 12px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.alarm .sign{animation:flash 1.2s ease-in-out infinite}}
@keyframes flash{50%{opacity:.35}}

/* ---------- Matriz de riesgo de entregas ---------- */
.risk-legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.risk-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dues{display:grid;gap:10px}
.due{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.due::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--rk)}
.due.critico{--rk:var(--rojo)} .due.alto{--rk:var(--naranjo)} .due.medio{--rk:var(--yellow)} .due.bajo{--rk:var(--verde)}
.due .lvltag{display:grid;justify-items:center;gap:2px;min-width:64px;padding-left:4px}
.due .lvltag small{font-family:var(--display);font-weight:800;letter-spacing:1.5px;font-size:12px;text-transform:uppercase;color:var(--rk)}
.due.medio .lvltag small{color:var(--ink)}
.due .info{min-width:0;display:grid;gap:4px}
.due .info strong{font-size:16px}
.due .info .meta{font-size:13px;color:var(--muted)}
.count{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.count small{font-size:15px;color:var(--muted);font-weight:700;margin:0 3px 0 1px}
.due.critico .count{color:var(--rojo)}
.meters{display:grid;gap:4px;margin-top:2px}
.meter{display:grid;grid-template-columns:86px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.meter .bar{height:7px}
.meter span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .5s}
.bar.time i{background:var(--rk)}
.due .act{display:grid;gap:6px;justify-items:end}
@media (max-width:560px){.due{grid-template-columns:auto minmax(0,1fr)}.due .act{grid-column:1/-1;justify-items:stretch}.due .act .btn{justify-self:stretch;text-align:center}}

/* ---------- Órdenes de trabajo ---------- */
.ot{background:var(--panel);color:var(--panel-ink);border-radius:16px;padding:6px 14px;box-shadow:var(--shadow)}
.ot-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 2px 8px;border-bottom:1px dashed #2f383c;font-family:var(--display);text-transform:uppercase;letter-spacing:2px;font-size:14px;color:var(--panel-muted)}
.ot-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #232b2f;padding:12px 2px;color:inherit}
.ot-row:last-child{border-bottom:0}
.ot-row:hover .ot-t{text-decoration:underline;text-underline-offset:3px}
.ot-t{display:block;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.3px;line-height:1.1}
.ot-s{display:block;font-size:14px;color:var(--panel-muted)}
.ot-st{font-family:var(--display);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:#263035;color:#d8e2dd;white-space:nowrap}
.ot-st.go{background:var(--yellow);color:#111}

/* ---------- Simulacro del día ---------- */
.drill{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border-radius:16px;padding:18px;box-shadow:var(--shadow);border:3px solid var(--yellow)}
.drill .k{font-family:var(--display);font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.drill h3{font-size:30px;font-weight:800;text-transform:uppercase}
.drill p{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:58ch}
@media (max-width:560px){.drill{grid-template-columns:auto minmax(0,1fr)}.drill .btn{grid-column:1/-1;justify-self:stretch}}

/* ---------- Ramos ---------- */
.ramos{display:grid;gap:14px}
.ramo{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;text-align:left;width:100%;background:var(--surface);border:0;border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s}
.ramo::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--c)}
.ramo:hover{transform:translateY(-2px)}
.ramo .head{display:flex;gap:14px;align-items:center;min-width:0}
.ramo .head>span:nth-child(2){min-width:0;flex:1}
.ramo h3{font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.ramo .sub{font-size:14px;color:var(--muted);display:block}
.ramo .go{margin-left:auto;font-family:var(--display);font-size:26px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.warn,.chip.now{background:var(--yellow);border-color:var(--yellow);color:#111}
.chip.red{background:var(--rojo);border-color:var(--rojo);color:#fff}
.chip.c{background:color-mix(in srgb,var(--c) 15%,var(--surface));border-color:color-mix(in srgb,var(--c) 45%,var(--surface))}
.chip.past{background:transparent}
/* hoja de ruta: una señal por semana */
.route-signs{display:flex;flex-wrap:wrap;gap:6px}
.rs{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;background:var(--surface2);border:2px solid var(--line);color:var(--muted);position:relative}
.rs.part{border-color:var(--c);color:var(--ink)}
.rs.done{background:var(--c);border-color:var(--c);color:#fff}
.rs.here{background:var(--yellow);border-color:#111;color:#111}
.rs.final{border-style:dashed}
@media (prefers-reduced-motion:no-preference){.rs.here{animation:beacon 1.8s ease-in-out infinite}}
@keyframes beacon{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--yellow) 25%,transparent)}}

/* ---------- Vista de ramo ---------- */
.back{border:0;background:transparent;font-weight:700;color:var(--muted);padding:14px 0 0;font-size:15px}
.hero{margin-top:10px;border-radius:18px;background:var(--c);color:#fff;padding:20px;display:grid;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:0;top:0;bottom:0;width:22px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 8px,transparent 8px 16px)}
.hero .top2{display:flex;gap:14px;align-items:center;position:relative;z-index:1;padding-right:20px}
.hero h2{font-size:40px;font-weight:900;text-transform:uppercase}
.hero .meta{font-size:14px;opacity:.92}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;z-index:1;padding-right:20px}
.nums div{background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px}
.nums b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.nums span{font-size:12px;opacity:.92}
.next{background:var(--surface);border-radius:16px;padding:18px;display:grid;gap:8px;box-shadow:var(--shadow);border-left:8px solid var(--c)}
.next .k{font-family:var(--display);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.next h3{font-size:32px;font-weight:800}
.next p{margin:0;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px;background:var(--ink);color:var(--bg);justify-self:start;text-decoration:none;display:inline-block}
.btn.c{background:var(--c);color:#fff}
.btn.y{background:var(--yellow);color:#111}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.review{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:12px 14px;flex-wrap:wrap}
.review p{margin:0;flex:1;font-size:15px;min-width:200px}
.note{font-size:14px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.empty strong{color:var(--ink)}
.route{display:grid;gap:12px}
.leg{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.leg>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.leg>summary::-webkit-details-marker{display:none}
.wk{width:56px;height:56px;border-radius:10px;background:var(--surface2);border:3px solid var(--line);display:grid;place-items:center;text-align:center;line-height:1;font-family:var(--display)}
.wk small{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.wk b{font-size:24px;font-weight:800}
.leg.actual .wk{background:var(--yellow);border-color:#111;color:#111}
.leg.actual .wk small{color:#111}
.leg.lista .wk{background:var(--c);border-color:var(--c);color:#fff}
.leg.lista .wk small{color:#fff}
.leg h3{font-size:24px;font-weight:700}
.leg .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.leg .tog{font-family:var(--display);font-size:24px;color:var(--muted);transition:transform .2s}
.leg[open] .tog{transform:rotate(90deg)}
.leg .body{padding:0 16px 8px}
.weekbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 6px;font-size:14px;color:var(--muted)}
.weekbar .bar{flex:1;min-width:90px}
.weekbar .btn{padding:7px 12px;font-size:14px}
ol.stations{list-style:none;margin:0;padding:0}
ol.stations li{position:relative;padding:0 0 0 46px}
ol.stations li::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:6px;background:var(--line)}
ol.stations li.done::before{background:var(--c)}
ol.stations li:first-child::before{top:22px}
ol.stations li:last-child::before{bottom:calc(100% - 22px)}
.stop{position:absolute;left:3px;top:10px;width:30px;height:30px;border-radius:6px;background:var(--surface);border:4px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800}
li.done .stop{border-color:var(--c);background:var(--c);color:#fff}
li.next .stop{border-color:#111;background:var(--yellow);color:#111}
.stationbtn{display:flex;width:100%;text-align:left;gap:10px;align-items:center;justify-content:space-between;border:0;background:transparent;padding:10px 0 14px;border-bottom:1px solid var(--line)}
li:last-child .stationbtn{border-bottom:0}
.stationbtn .nm{font-family:var(--display);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block}
.stationbtn .tt{font-weight:700;display:block}
.stationbtn .rt{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink)}

/* ---------- Reproductor: la inspección ---------- */
.player{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20}
.phead{position:sticky;top:env(safe-area-inset-top,0px);background:var(--panel);color:var(--panel-ink);z-index:2}
.phead .in{max-width:800px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.phead .tape{height:8px}
.close{border:0;background:transparent;font-size:15px;font-weight:700;color:var(--panel-muted);padding:6px 0}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:10px;border-radius:2px;background:#2a3236}
.steps i.on{background:var(--c)}
.steps i.cur{background:var(--yellow)}
.xpnow{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:var(--yellow);white-space:nowrap}
.combo{display:inline-block;margin-right:8px;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--yellow);color:#111;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.combo.pop{animation:pop .35s ease-out}}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.pbody{max-width:800px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 130px;display:grid;gap:16px}
.kicker{font-family:var(--display);text-transform:uppercase;letter-spacing:2px;color:var(--c);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.q{font-size:23px;font-weight:700;line-height:1.3;margin:0}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 14px 14px 16px;text-align:left;font-size:17px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateX(3px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
@media (prefers-reduced-motion:no-preference){.opt.bad{animation:shake .3s}.fb.ok{animation:rise .35s ease-out}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}
.fb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;border-radius:12px;padding:14px;background:var(--surface);box-shadow:var(--shadow)}
.fb strong{display:block;font-family:var(--display);font-size:23px;text-transform:uppercase;letter-spacing:.5px}
.fb.ok strong{color:var(--ok)}
.fb.bad strong{color:var(--bad)}
.fb p,.fb ol{margin:6px 0 0}
.reading{background:var(--surface);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.reading p{margin:0 0 12px;font-size:18px;max-width:65ch}
.reading p:last-child{margin-bottom:0}
.reading.ojo{border:3px solid var(--yellow);position:relative}

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NIVELES=[[0,"Aprendiz"],[150,"Brigadista"],[400,"Monitor de seguridad"],[800,"Supervisor"],[1500,"Prevencionista"],[2600,"Jefe de prevención"],[4000,"Experto en prevención"]];
const fecha=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hoy=()=>fecha(new Date());
const ayer=()=>{const d=new Date();d.setDate(d.getDate()-1);return fecha(d)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const oscuro=()=>{const t=document.documentElement.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
const fmtN=(x,d=2)=>Number(x).toLocaleString("es-CL",{maximumFractionDigits:d});

/* ---------- Señales de seguridad (SVG) ---------- */
const SIG={
  cruz:(s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="6" fill="${c}"/><path d="M16 8h8v8h8v8h-8v8h-8v-8H8v-8h8z" fill="#fff"/></svg>`,
  grafico:(s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="${c}"/><path d="M11 29V20m6 9V13m6 16V17m6 12V10" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>`,
  alerta:(s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="6" fill="${c}"/><path d="M20 7l14 25H6z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M20 15v8" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="27.5" r="1.9" fill="#fff"/></svg>`,
  peligro:(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l18 32H2z" fill="#f6c700" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M20 14v10" stroke="#111" stroke-width="3.4" stroke-linecap="round"/><circle cx="20" cy="29" r="2.1" fill="#111"/></svg>`,
  ok:(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="6" fill="#00843d"/><path d="M11 21l6 6 12-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  no:(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#fff" stroke="#c8102e" stroke-width="5"/><path d="M8 8l24 24" stroke="#c8102e" stroke-width="5"/></svg>`,
  play:(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><path d="M14 10l17 10-17 10z" fill="#fff"/></svg>`
};
function senalRamo(r,s){
  const c=colorDe(r.codigo), cod=(r.codigo||"").toUpperCase();
  const k=r.senal||(cod.startsWith("SALPX")?"cruz":cod.startsWith("ESTAP")?"grafico":cod.startsWith("CEMCG")?"alerta":"");
  if(k&&SIG[k])return `<span class="sign">${SIG[k](s,c)}</span>`;
  return `<span class="sign"><svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="${c}"/><text x="20" y="26" text-anchor="middle" font-family="Barlow Condensed,Arial" font-weight="800" font-size="17" fill="#fff">${esc(r.linea||"")}</text></svg></span>`;
}

let db=null, sample=null, semanas=[], prog=null, ramos=[];
const PROG_PATH="progreso/osvaldo";
const blank=()=>({xp:0,racha:0,ultimoDia:"",misiones:{},preguntas:{},notas:{},checks:{},repasos:{},desafios:{}});
const PALETA=["#00843d","#0057a8","#c2501b","#7a3db8","#a8365b"];

function listaRamos(){
  const out=ramos.slice();
  semanas.forEach(s=>{if(!out.find(r=>r.codigo===s.codigo))out.push({codigo:s.codigo,nombre:s.curso,linea:"L"+(out.length+1)})});
  out.forEach((r,i)=>{if(!r.color)r.color=PALETA[i%PALETA.length]});
  return out;
}
function ramoDe(cod){return listaRamos().find(r=>r.codigo===cod)}
function colorDe(cod){const r=ramoDe(cod);if(!r)return PALETA[0];return (oscuro()&&r.colorOscuro)||r.color}

/* ---------- Guardado ---------- */
let saving=false, dirty=false;
async function save(){
  if(!db)return;
  if(saving){dirty=true;return}
  saving=true;
  try{await db.doc(PROG_PATH).set(JSON.parse(JSON.stringify(prog)))}
  catch(e){toast(e&&e.code==="quota_exceeded"?"No hay espacio para guardar el avance":"No se pudo guardar; se reintentará")}
  saving=false;
  if(dirty){dirty=false;save()}
}
let noteTimer=null;
function saveSoon(){clearTimeout(noteTimer);noteTimer=setTimeout(save,1200)}
function ganar(xp){
  if(!xp)return;
  const h=hoy();
  if(prog.ultimoDia!==h){prog.racha=(prog.ultimoDia===ayer())?(prog.racha||0)+1:1;prog.ultimoDia=h}
  prog.xp=(prog.xp||0)+xp;
  sesionXP+=xp; $("#p-xp").textContent="+"+sesionXP;
}
async function copiar(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(e){return false}
}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2600)}

/* ---------- Cálculos ---------- */
function nivel(xp){let cur=NIVELES[0],nx=null;for(let i=0;i<NIVELES.length;i++){if(xp>=NIVELES[i][0]){cur=NIVELES[i];nx=NIVELES[i+1]||null}}return{cur,nx}}
const misKey=(s,m)=>s.id+"/"+m.id;
const et=s=>s.etiqueta||"Semana";
const corto=s=>(s.etiqueta?"L":"S")+s.semana;
const cronologico=l=>l.slice().sort((a,b)=>(a.desde||"").localeCompare(b.desde||"")||((a.semana||0)-(b.semana||0)));
const semDe=cod=>cronologico(semanas.filter(s=>s.codigo===cod));
function estado(s){const h=hoy();if(s.desde&&s.desde>h)return"prox";if(s.hasta&&s.hasta<h)return"pasada";return"actual"}
function ordenSem(lista){const g={actual:0,prox:1,pasada:2};return lista.slice().sort((a,b)=>{const ea=estado(a),eb=estado(b);if(ea!==eb)return g[ea]-g[eb];return ea==="pasada"?(b.desde||"").localeCompare(a.desde||""):(a.desde||"").localeCompare(b.desde||"")})}
const fmtDia=d=>new Date(d+"T12:00").toLocaleDateString("es-CL",{weekday:"short",day:"numeric",month:"short"});
const fmtRango=s=>s.desde&&s.hasta?new Date(s.desde+"T12:00").toLocaleDateString("es-CL",{day:"numeric",month:"short"})+" – "+new Date(s.hasta+"T12:00").toLocaleDateString("es-CL",{day:"numeric",month:"short"}):"";
function evaluables(s){const out=[];(s.misiones||[]).forEach(m=>(m.pasos||[]).forEach(p=>{if(p.id&&(p.t==="mc"||p.t==="orden"||p.t==="clasificar"))out.push({s,m,p})}));return out}
function dominio(s){const q=evaluables(s),P=prog.preguntas||{};if(!q.length)return null;return Math.round(q.filter(x=>{const r=P[x.p.id];return r&&r.ok>0&&!r.pend}).length/q.length*100)}
function priorizar(items){
  const P=prog.preguntas||{},now=Date.now();
  return items.map(x=>{const r=P[x.p.id];let w;
    if(!r)w=50;else if(r.pend)w=100;else{const dias=r.ultima?Math.max(0,(now-Date.parse(r.ultima+"T12:00"))/86400000):30;w=Math.min(dias,30)+(r.fallos||0)*4}
    return{x,w:w+Math.random()*12}}).sort((a,b)=>b.w-a.w).map(o=>o.x);
}
function mazo(sems,n){const c=[];sems.forEach(s=>(s.misiones||[]).forEach(m=>(m.pasos||[]).forEach(p=>{if(p.t==="tarjetas")(p.cartas||[]).forEach(x=>c.push(x))})));return shuffle(c).slice(0,n)}

const hechasDe=s=>(s.misiones||[]).filter(m=>(prog.misiones[misKey(s,m)]||{}).hecha).length;
function siguiente(cod){
  const lista=ordenSem(cod?semDe(cod):semanas);
  for(const s of lista)for(const m of s.misiones||[])if(!(prog.misiones[misKey(s,m)]||{}).hecha)return{s,m};

}
function fallos(cod){
  const out=[],P=prog.preguntas||{};
  semanas.filter(s=>!cod||s.codigo===cod).forEach(s=>(s.misiones||[]).forEach(m=>(m.pasos||[]).forEach(p=>{if(p.id&&P[p.id]&&P[p.id].pend)out.push({s,m,p})})));
  return out;
}
function resumen(cod){

  semDe(cod).forEach(s=>(s.misiones||[]).forEach(m=>{total++;const st=prog.misiones[misKey(s,m)]||{};if(st.hecha){hechas++;ok+=st.ok||0;q+=st.total||0}}));
  return{total,hechas,pct:q?Math.round(ok/q*100):null};
}
function entregas(cod){

// nivel de riesgo de una entrega según el tiempo que queda
function riesgo(ms){if(ms<24*3600000)return["critico","Crítico"];if(ms<72*3600000)return["alto","Alto"];if(ms<7*86400000)return["medio","Medio"];return["bajo","Bajo"]}
function partes(ms){ms=Math.max(0,ms);const d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000);return{d,h,m}}
function cuenta(ms){if(ms<=0)return"Cerró";const{d,h,m}=partes(ms);return d?`${d}<small>d</small>${h}<small>h</small>`:`${h}<small>h</small>${String(m).padStart(2,"0")}<small>m</small>`}
function fmtFalta(ms){if(ms<=0)return"cerró";const{d,h,m}=partes(ms);return d?`${d} d ${h} h`:`${h} h ${m} m`}
const fmtFecha=t=>new Date(t).toLocaleString("es-CL",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false});
const hora=()=>new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit",hour12:false});
function turnoActual(){const h=new Date().getHours();return h<6?"Turno de noche":h<14?"Turno de mañana":h<22?"Turno de tarde":"Turno de noche"}
// cuánto avanzó la preparación de una tarea (palabras escritas en el taller y checklist)
function preparacion(s,e){
  const m=e.mision&&(s.misiones||[]).find(x=>x.id===e.mision);const p=m&&(m.pasos||[]).find(x=>x.t==="taller");
  if(!p)return null;
  const k=id=>s.id+"/"+id;
  const qs=p.preguntas||[];let pal=0;qs.forEach(q=>{const t=(prog.notas||{})[k(q.id)]||"";pal+=Math.min(120,t.trim()?t.trim().split(/\s+/).length:0)});
  const cks=(p.checklist||[]).filter((_,i)=>(prog.checks||{})[k("ck"+i)]).length;
  const a=qs.length?pal/(qs.length*120):0, b=(p.checklist||[]).length?cks/p.checklist.length:0;
  return Math.round((a*0.8+b*0.2)*100);
}
function tiempoUsado(s,t){const ini=Date.parse((s.desde||hoy())+"T00:00");const tot=t-ini;if(tot<=0)return 100;return Math.max(0,Math.min(100,Math.round((Date.now()-ini)/tot*100)))}

function abrirRelampago(s){

    const b=sxy/sxx,a=my-b*mx,r2=sxy*sxy/(sxx*syy);s+=`<line class="g-line" x1="${X(xa)}" y1="${Yy(a+b*xa)}" x2="${X(xb)}" y2="${Yy(a+b*xb)}"/>`;
    extra=`<div class="legend"><span><i style="background:var(--rojo)"></i>Recta: Ŷ = ${fmtN(a,2)} ${b<0?"−":"+"} ${fmtN(Math.abs(b),3)}·X</span><span>R² = ${fmtN(r2,3)}</span></div>`}
  if(p.lineaY!=null)s+=`<line class="g-limit" x1="${x0}" x2="${x1}" y1="${Yy(p.lineaY)}" y2="${Yy(p.lineaY)}"/><text class="g-txt" x="${x1}" y="${Yy(p.lineaY)-6}" text-anchor="end">límite ${fmtN(p.lineaY)}</text>`;
  pts.forEach(([x,y])=>{s+=`<circle class="g-pt" cx="${X(x)}" cy="${Yy(y)}" r="6"/>`});
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.titulo||"Gráfico de dispersión")}">${s}</svg>`,extra};
}
function svgHistograma(p){
  const d=p.datos.slice().sort((a,b)=>a-b),n=d.length,k=p.clases||Math.round(1+3.3*Math.log10(n)),mn=d[0],mx=d[n-1],A=(mx-mn)/k||1;
  const f=Array(k).fill(0);d.forEach(v=>{f[Math.min(k-1,Math.floor((v-mn)/A))]++});
  const H=300,x0=56,x1=W-10,y0=30,y1=H-44,max=bonito(Math.max(...f)*1.15),bw=(x1-x0)/k;
  let s=ejes(x0,y0,x1,y1,max,"frecuencia");
  f.forEach((v,i)=>{const h=(y1-y0)*v/max;s+=`<rect class="g-bar" x="${x0+bw*i}" y="${y1-h}" width="${bw-1}" height="${h}"/><text class="g-val" x="${x0+bw*i+bw/2}" y="${y1-h-6}" text-anchor="middle">${v}</text><text class="g-txt" x="${x0+bw*i}" y="${y1+18}" text-anchor="middle">${fmtN(mn+A*i,1)}</text>`});
  s+=`<text class="g-txt" x="${x1}" y="${y1+18}" text-anchor="end">${fmtN(mx,1)}</text>`;
  if(p.unidad)s+=`<text class="g-txt" x="${(x0+x1)/2}" y="${H-4}" text-anchor="middle">${esc(p.unidad)}</text>`;
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.titulo||"Histograma")}">${s}</svg>`};
}
function grafico(p){
  const fn={barras:svgBarras,binomial:svgBinomial,normal:svgNormal,caja:svgCaja,dispersion:svgDispersion,histograma:svgHistograma}[p.tipo];
  const d=document.createElement("div");d.className="figure";
  let g={svg:"",extra:""};try{g=fn?fn(p):g}catch(e){g={svg:`<p class="note">No se pudo dibujar este gráfico.</p>`}}
  d.innerHTML=`<h3>${esc(p.titulo||"")}</h3>${g.svg}${g.extra||""}${p.nota?`<p class="cap">${esc(p.nota)}</p>`:""}`;
  body.appendChild(d); setNext("Continuar",avanzar);
}
function diagrama(p){
  const d=document.createElement("div");d.className="figure";
  if(p.tipo==="capas"){
    const n=(p.capas||[]).length;
    d.innerHTML=`<h3>${esc(p.titulo||"")}</h3><div class="layers">${p.capas.map((c,i)=>`<div class="layer" style="background:color-mix(in srgb,var(--c) ${12+Math.round(i/(Math.max(1,n-1))*40)}%,var(--surface))"><b>${esc(c[0])}</b><span>${esc(c[1]||"")}</span></div>`).join("")}</div>`;
  }else{
    d.innerHTML=`<h3>${esc(p.titulo||"")}</h3><div class="flow">${(p.nodos||[]).map(nd=>`<div class="fnode"><div><b>${esc(nd[0])}</b><span>${esc(nd[1]||"")}</span></div></div>`).join("")}</div>`;
  }
  body.appendChild(d); setNext("Continuar",avanzar);
}
function video(p){
  const url="https://www.youtube.com/results?search_query="+encodeURIComponent(p.busqueda||p.titulo||"");
  const a=document.createElement("a");a.className="vid";a.href=url;a.target="_blank";a.rel="noopener";
  a.innerHTML=`<span class="play">${SIG.play(36)}</span><span><b>${esc(p.titulo||"Video")}</b><span>Abre una búsqueda en YouTube: “${esc(p.busqueda||"")}”</span></span>`;
  body.appendChild(a);
  if(p.nota){const n=document.createElement("p");n.className="note";n.style.margin="0";n.textContent=p.nota;body.appendChild(n)}
  setNext("Continuar",avanzar);
}
// entrenador de ritmo de compresiones (RCP)
let ritmoCtx=null, ritmoTimer=null;
function detenerRitmo(){clearInterval(ritmoTimer);ritmoTimer=null;if(ritmoCtx){try{ritmoCtx.close()}catch(e){}ritmoCtx=null}document.onkeydown=null}
function ritmo(p){
  const meta=p.compresiones||30, bpmObj=p.bpm||110;
  const d=document.createElement("div");d.className="cpr";
  d.innerHTML=`<h2 class="q" style="color:inherit">${esc(p.titulo||"Entrenador de compresiones")}</h2>
    <p class="note" style="color:var(--panel-muted);margin:0">Toca el botón (o la barra espaciadora) como si comprimieras el pecho. Meta: entre 100 y 120 por minuto. Haz ${meta} compresiones.</p>
    <div style="display:flex;gap:10px;align-items:center"><span class="guide" id="cpr-guide"></span><label class="note" style="color:var(--panel-muted)"><input type="checkbox" id="cpr-snd"> Guía de sonido (${bpmObj} por minuto)</label></div>
    <button class="pump" id="cpr-btn">Comprimir</button>
    <div class="bpm" id="cpr-bpm">—<small> por min</small></div>
    <div class="gauge"><i id="cpr-i"></i></div><div class="gl"><span>80</span><span>100</span><span>120</span><span>140</span></div>
    <div class="msg" id="cpr-msg">Empieza cuando quieras</div>
    <div class="note" style="color:var(--panel-muted)" id="cpr-n">0 / ${meta}</div>`;
  body.appendChild(d);
  const taps=[];let enRango=0,total=0;
  const guide=$("#cpr-guide");guide.classList.add("on");
  $("#cpr-snd").onchange=e=>{
    if(e.target.checked){try{ritmoCtx=new (window.AudioContext||window.webkitAudioContext)();ritmoTimer=setInterval(()=>{const o=ritmoCtx.createOscillator(),g=ritmoCtx.createGain();o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(ritmoCtx.destination);o.start();o.stop(ritmoCtx.currentTime+0.05)},60000/bpmObj)}catch(err){e.target.checked=false}}
    else detenerRitmo();
  };
  const tap=()=>{
    const t=performance.now();taps.push(t);if(taps.length>6)taps.shift();total++;
    let bpm=null;if(taps.length>=3){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);bpm=Math.round(60000/iv)}
    const msg=$("#cpr-msg");
    if(bpm){$("#cpr-bpm").innerHTML=`${bpm}<small> por min</small>`;$("#cpr-i").style.left=Math.max(0,Math.min(100,(bpm-80)/60*100))+"%";
      if(bpm<100){msg.className="msg lo";msg.textContent="Más rápido"}else if(bpm>120){msg.className="msg hi";msg.textContent="Más lento"}else{msg.className="msg ok";msg.textContent="¡Ritmo correcto!";enRango++}}
    $("#cpr-n").textContent=Math.min(total,meta)+" / "+meta;
    if(total>=meta){next.disabled=false;note.textContent=`En rango: ${Math.round(enRango/Math.max(1,total-2)*100)} %`}
  };
  $("#cpr-btn").onclick=tap;
  document.onkeydown=e=>{if(e.code==="Space"&&!player.hidden){e.preventDefault();tap()}};
  setNext("Terminar entrenamiento",()=>{const pct=enRango/Math.max(1,total-2);totalQ++;if(pct>=0.6){aciertos++;ganar(15);racha(true)}else racha(false);avanzar()},false);
}
function taller(p,s,m){
  const key=k=>s.id+"/"+k;
  const w=document.createElement("div");w.className="taller";
  w.innerHTML=`<h2 class="q">Prepara tu respuesta</h2><div class="case"><strong>El caso.</strong> ${esc(p.caso)}</div>
  <p class="note" style="margin:0">Escribe tus ideas con tus palabras: no tiene que quedar perfecto. Se guarda solo. Después pide una revisión según la rúbrica: Claude te dice qué falta, pero no escribe la respuesta por ti, porque la tarea tiene que ser elaboración propia.</p>`;
  p.preguntas.forEach(q=>{
    const d=document.createElement("div");d.className="tq";
    d.innerHTML=`<h3>${esc(q.p)}</h3><span class="ind">Lo que evalúa el profe: ${esc(q.indicador)}</span>
      <details><summary>Ver pistas</summary><ul>${q.pistas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>
      <label class="note" for="ta-${q.id}">Tus ideas</label><textarea id="ta-${q.id}"></textarea>
      <div class="row"><button class="btn ghost" id="ai-${q.id}">Revisar con Claude</button><span class="note" id="cnt-${q.id}"></span></div><div class="ai" id="out-${q.id}" hidden></div>`;
    w.appendChild(d);
  });
  const ck=document.createElement("div");ck.className="tq";
  ck.innerHTML=`<h3>Antes de entregar</h3><div class="check">${p.checklist.map((c,i)=>`<label><input type="checkbox" id="ck-${i}"> <span>${esc(c)}</span></label>`).join("")}</div>`;
  w.appendChild(ck); body.appendChild(w);
  p.preguntas.forEach(q=>{
    const ta=$("#ta-"+q.id), cnt=$("#cnt-"+q.id), out=$("#out-"+q.id), bt=$("#ai-"+q.id);
    ta.value=prog.notas[key(q.id)]||"";
    const upd=()=>{const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;cnt.textContent=n+" palabras"};upd();
    ta.oninput=()=>{prog.notas[key(q.id)]=ta.value;upd();saveSoon()};
    const prev=prog.notas[key(q.id)+"#ai"]; if(prev){out.hidden=false;out.textContent=prev}
    if(!sample)bt.textContent="Copiar para revisar en Claude";
    bt.onclick=async()=>{
      if(ta.value.trim().split(/\s+/).length<25){toast("Escribe al menos unas 25 palabras para revisar");return}
      const prompt=`Eres docente de la asignatura "${s.curso||"de la carrera"}" (IACC, Chile, Técnico en Prevención de Riesgos). Un estudiante prepara el borrador de una tarea. Tu trabajo es darle retroalimentación formativa, NO escribir la respuesta por él (la tarea debe ser elaboración propia).
${p.ia?`
REGLA DE USO DE IA DE ESTA TAREA: ${p.ia}
Respétala estrictamente: no calcules ni sugieras valores numéricos del caso, no construyas tablas y no interpretes los datos por él. Solo dile si su borrador cubre todo lo que pide la pregunta, si usa bien los conceptos y si explica su procedimiento.
`:""}
CASO: ${p.caso}

PREGUNTA: ${q.p}
INDICADOR DE EVALUACIÓN: ${q.indicador}
Escala de la rúbrica: 4 = de forma correcta; 3 = de forma general; 2 = de forma parcial; 1 = presenta dificultad; 0 = no responde.
Contenidos de la semana que se espera usar: ${q.pistas.join("; ")}.

BORRADOR DEL ESTUDIANTE:
"""${ta.value.trim().slice(0,6000)}"""

Responde en español de Chile, cercano y directo, en texto plano (sin markdown, sin asteriscos), con este formato exacto:
Nivel estimado: N de 4, en una frase por qué.
Lo que está bien: 1 o 2 puntos breves.
Lo que falta: 2 a 4 puntos concretos, en forma de pregunta o pista (no redactes la respuesta).
Términos técnicos que podrías usar: 3 a 5 palabras.
Máximo 170 palabras.`;
      if(!sample){
        const ok=await copiar(prompt);
        out.hidden=false;
        out.textContent=ok?"Copiado. Abre Claude (claude.ai o la app), pega el texto y envíalo: te dirá qué le falta a tu borrador según la rúbrica, sin escribirlo por ti.":"No se pudo copiar automáticamente. Mantén presionado este texto para copiarlo:\n\n"+prompt;
        return;
      }
      bt.disabled=true; out.hidden=false; out.textContent="Revisando…";
      try{
        const r=await sample(prompt,{onText:({text})=>{out.textContent=text},cache:false});
        out.textContent=r.text; prog.notas[key(q.id)+"#ai"]=r.text;
        const flag=key(q.id)+"#xp"; if(!prog.notas[flag]){prog.notas[flag]="1";ganar(20)} save();
      }catch(e){
        if(e&&e.code==="not_granted"){out.textContent="La revisión con Claude no está habilitada en esta vista.";sample=null}
        else if(e&&e.code==="rate_limited"){out.textContent="Demasiadas revisiones seguidas. Espera un par de minutos."}
        else out.textContent="No se pudo revisar ahora. Inténtalo de nuevo en un rato.";
      }
      bt.disabled=false;
    };
  });
  p.checklist.forEach((_,i)=>{const c=$("#ck-"+i);const k=key("ck"+i);c.checked=!!prog.checks[k];c.onchange=()=>{prog.checks[k]=c.checked;saveSoon()}});
  setNext("Terminar taller",()=>{totalQ=0;avanzar()});
}
function fin(){
  pasos(true); body.innerHTML=""; note.textContent="";
  let titulo="Inspección", destino=actual&&actual.m?actual.m.titulo:"", extra="";
  const pct=totalQ?Math.round(aciertos/totalQ*100):null;
  if(modo==="mision"&&actual){
    const k=misKey(actual.s,actual.m); const prev=prog.misiones[k]||{};
    if(!prev.hecha)ganar(25);
    prog.misiones[k]={hecha:true,ok:Math.max(aciertos,prev.ok||0),total:totalQ||prev.total||0,fecha:hoy()};
    titulo="Inspección · "+corto(actual.s);destino=actual.m.estacion+": "+actual.m.titulo;
  }else if(modo==="relampago"&&actual){
    titulo="Inspección rápida · "+corto(actual.s);destino=actual.s.titulo;
    prog.repasos=prog.repasos||{}; prog.repasos[actual.s.id]={fecha:hoy(),pct};
    extra=`Cumplimiento de ${et(actual.s).toLowerCase()} ${actual.s.semana}: <strong>${dominio(actual.s)} %</strong>.`;
  }else if(modo==="desafio"){
    titulo="Simulacro del día";destino="Todos tus ramos";
    prog.desafios=prog.desafios||{};
    const h=hoy();
    if(prog.desafios[h]===undefined){ganar(30);extra="Bono diario: <strong>+30</strong>."}
    prog.desafios[h]=Math.max(pct||0,prog.desafios[h]||0);
    Object.keys(prog.desafios).sort().slice(0,-30).forEach(x=>delete prog.desafios[x]);
  }else{titulo="Acciones correctivas";destino="Preguntas falladas"}
  const {cur}=nivel(prog.xp||0);
  const aprobado=pct===null||pct>=60;
  const d=document.createElement("div");d.className="permit";
  d.innerHTML=`<div class="p1"><b>${esc(titulo)}</b><span>${esc(new Date().toLocaleDateString("es-CL"))} · ${esc(hora())}</span></div>
    <div class="p2"><span class="stamp ${aprobado?"":"obs"}">${aprobado?"Aprobado":"Con observaciones"}</span><small>Área inspeccionada</small><strong>${esc(destino)}</strong><span class="score">+${sesionXP}</span><small>puntos</small></div>
    <div class="p3"><div><small>Aciertos</small><b>${pct===null?"—":aciertos+"/"+totalQ}</b></div><div><small>Mejor combo</small><b>${mejorCombo>=2?"×"+mejorCombo:"—"}</b></div><div><small>Racha</small><b>${prog.racha||1} ${prog.racha===1?"día":"días"}</b></div></div>
    <div class="p4"><span>Nivel: <strong>${esc(cur[1])}</strong></span>${extra?`<span>${extra}</span>`:""}${pct!==null&&pct<100?`<span>Lo que fallaste quedó como acción correctiva.</span>`:""}</div><div class="tape" aria-hidden="true"></div>`;
  body.appendChild(d);
  save();
  const nx=modo==="mision"&&actual?siguiente(actual.s.codigo):null;
  if(nx){setNext("Siguiente estación →",()=>abrir(nx.s,nx.m));note.textContent="O sal con ✕ y sigue mañana"}
  else if(modo==="relampago"&&actual){const s0=actual.s;setNext("Otra ronda",()=>abrirRelampago(s0));note.textContent="Las preguntas cambian en cada ronda"}
  else setNext("Volver al panel",cerrar);
}

/* ---------- Arranque ---------- */
async function start(){
  const timer=setTimeout(()=>{if(!semanas.length)$("#view").innerHTML=`<div class="empty" style="margin-top:20px">No se pudo conectar con tus datos todavía. Revisa tu conexión; la página seguirá intentando.</div>`},10000);
  try{db=await claude.use("db")}catch(e){db=null}
  try{sample=await claude.use("sample")}catch(e){sample=null}
  if(!db){clearTimeout(timer);$("#view").innerHTML=`<div class="empty" style="margin-top:20px">Abre esta página con tu sesión de Claude iniciada para ver tus ramos y guardar tu avance.</div>`;return}
  let got={p:false,s:false,r:false};
  const ready=()=>{if(got.p&&got.s&&got.r){clearTimeout(timer);if(player.hidden)renderAll();else renderStats()}};
  db.doc(PROG_PATH).onSnapshot(snap=>{
    if(snap.exists&&!saving&&!snap.metadata.hasPendingWrites)prog=Object.assign(blank(),JSON.parse(JSON.stringify(snap.data()||{})));
    got.p=true;ready();
  },()=>{got.p=true;ready()});
  db.doc("config/ramos").onSnapshot(snap=>{
    ramos=(snap.exists&&Array.isArray((snap.data()||{}).ramos))?JSON.parse(JSON.stringify(snap.data().ramos)):[];
    got.r=true;ready();
  },()=>{got.r=true;ready()});
  db.collection("semanas").onSnapshot(q=>{
    semanas=q.docs.map(d=>d.data()).filter(x=>x&&Array.isArray(x.misiones));
    got.s=true;ready();
  },()=>{got.s=true;clearTimeout(timer);$("#view").innerHTML=`<div class="empty" style="margin-top:20px">No se pudieron cargar las misiones. Recarga la página en un rato.</div>`});
  setInterval(()=>{if(player.hidden&&got.s)renderAll()},300000);
  setInterval(tick,30000);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(player.hidden)renderAll()});
}
prog=blank(); renderStats();
let espera=0;
(function boot(){
  if(window.claude&&typeof window.claude.use==="function"){start();return}
  if(++espera>40){$("#view").innerHTML=`<div class="empty" style="margin-top:20px">Abre esta página desde Claude para ver tus ramos.</div>`;return}
  setTimeout(boot,250);
})();
})();
</script>
