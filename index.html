<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turno de estudio</title>
<meta name="theme-color" content="#141c18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Plan: la app es una red de trenes nocturna. Portada = tablero de salidas LED; cada ramo es una línea
   de metro con sus semanas como estaciones; cada misión es un viaje: el tren avanza por la vía y al
   llegar se entrega un boleto. Borde de andén amarillo/negro como firma. */
:root{
  --bg:#e8ebe6; --surface:#ffffff; --surface2:#f2f4f0; --ink:#111816; --muted:#566360; --line:#d0d6d1;
  --yellow:#f3c300; --ok:#0a7a4b; --ok-soft:#dbefe4; --bad:#b3261e; --bad-soft:#f8e0dd;
  --board:#0c100f; --board2:#161c1a; --led:#ffb627; --led-dim:#5c4512; --led-ok:#5fe39a; --led-bad:#ff6b5e;
  --c:#0a7a4b;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 0 rgba(17,24,22,.06),0 8px 24px -14px rgba(17,24,22,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e0d; --surface:#131917; --surface2:#19211e; --ink:#e6ede9; --muted:#97a6a0; --line:#27322e;
    --ok:#3ac487; --ok-soft:#163626; --bad:#ff8a80; --bad-soft:#3a1c1a; --board:#050807; --board2:#0e1311;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e0d; --surface:#131917; --surface2:#19211e; --ink:#e6ede9; --muted:#97a6a0; --line:#27322e;
  --ok:#3ac487; --ok-soft:#163626; --bad:#ff8a80; --bad-soft:#3a1c1a; --board:#050807; --board2:#0e1311;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--board)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.02;margin:0;text-wrap:balance}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.edge{height:12px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,#1b1b1b 12px 24px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Cabecera: credencial de turno ---------- */
.top{background:var(--board);color:#eef3f0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 18px}
.top .in{max-width:820px;margin:0 auto;display:grid;gap:14px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand .k{font-family:var(--display);font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:13px;color:var(--led)}
.brand h1{font-size:44px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}
.stats{display:flex;gap:18px;align-items:center}
.stat{display:grid;line-height:1}
.stat b{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#9fb0a9;margin-top:4px}
.stat.fire b{color:var(--led)}
.lvl{display:grid;gap:6px}
.lvl .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#9fb0a9;flex-wrap:wrap}
.lvl .row strong{color:#eef3f0;font-family:var(--display);font-size:18px;letter-spacing:1px;text-transform:uppercase}
.lvlbar{height:8px;background:#26302c;border-radius:6px;overflow:hidden}
.lvlbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--led));border-radius:6px;transition:width .6s}

section.block{margin-top:28px;display:grid;gap:12px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sh h2{font-size:21px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:700}
.sh span{font-size:14px;color:var(--muted)}

/* ---------- Tablero de salidas (LED) ---------- */
.board{position:relative;background:var(--board);border-radius:14px;padding:14px 14px 10px;color:var(--led);box-shadow:inset 0 0 0 2px #232b28,var(--shadow);overflow:hidden}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 58%,rgba(0,0,0,.42) 60%) 0 0/3px 3px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--display);text-transform:uppercase;letter-spacing:3px;font-size:14px;color:#8fa39b;border-bottom:1px dashed #2b3431;padding-bottom:8px;margin-bottom:4px}
.bhead .clock{font-size:26px;letter-spacing:2px;color:var(--led);font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,182,39,.45)}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #1d2422;padding:10px 2px;color:inherit}
.brow:last-child{border-bottom:0}
.brow:hover .dest b{text-decoration:underline;text-underline-offset:3px}
.brow .lb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;color:#fff;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.dest{min-width:0;font-family:var(--display);text-transform:uppercase;letter-spacing:1px;line-height:1.1}
.dest b{display:block;font-size:21px;font-weight:700;color:var(--led);text-shadow:0 0 8px rgba(255,182,39,.35);overflow-wrap:anywhere}
.dest span{display:block;font-size:14px;color:#8fa39b;letter-spacing:.5px;text-transform:none;font-family:var(--body);margin-top:2px}
.when{text-align:right;font-family:var(--display);text-transform:uppercase;line-height:1.1}
.when b{display:block;font-size:22px;font-weight:800;color:var(--led);font-variant-numeric:tabular-nums;white-space:nowrap}
.when span{display:inline-block;margin-top:3px;font-size:12px;letter-spacing:1.5px;padding:2px 6px;border-radius:3px;background:#1f2724;color:#cfd8d4;white-space:nowrap}
.when span.go{background:#123524;color:var(--led-ok)}
.when span.last{background:#3b1512;color:var(--led-bad)}
@media (prefers-reduced-motion:no-preference){.when span.last{animation:blink 1.1s steps(2,start) infinite}}
@keyframes blink{to{visibility:hidden}}
.bempty{font-family:var(--display);text-transform:uppercase;letter-spacing:2px;color:#8fa39b;padding:12px 2px}

/* ---------- Expreso (desafío del día) ---------- */
.express{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border-radius:16px;padding:18px 18px 18px 22px;box-shadow:var(--shadow);overflow:hidden}
.express::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 8px,#1b1b1b 8px 16px)}
.express .k{font-family:var(--display);font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.express h3{font-size:30px;font-weight:800;text-transform:uppercase}
.express p{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:58ch}
@media (max-width:520px){.express{grid-template-columns:1fr}}

/* ---------- Ramos como líneas de metro ---------- */
.ramos{display:grid;gap:14px}
.ramo{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;text-align:left;width:100%;background:var(--surface);border:0;border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s}
.ramo:hover{transform:translateY(-2px)}
.ramo .head{display:flex;gap:14px;align-items:center;min-width:0}
.ramo .head>span:nth-child(2){min-width:0;flex:1}
.badge{flex:none;width:48px;height:48px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:21px}
.ramo h3{font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.ramo .sub{font-size:14px;color:var(--muted);display:block}
.ramo .go{margin-left:auto;font-family:var(--display);font-size:26px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.warn{background:var(--yellow);border-color:var(--yellow);color:#1b1b1b}
.chip.now{background:var(--yellow);border-color:var(--yellow);color:#1b1b1b}
.chip.c{background:color-mix(in srgb,var(--c) 16%,var(--surface));border-color:color-mix(in srgb,var(--c) 45%,var(--surface))}
.chip.past{background:transparent}

/* mapa de línea: semanas como estaciones */
.lmap{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:6px 0 0;min-width:0}
.lmap::before{content:"";position:absolute;left:12px;right:12px;top:17px;height:8px;border-radius:4px;background:var(--line)}
.lmap .fill{position:absolute;left:12px;top:17px;height:8px;border-radius:4px;background:var(--c)}
.lst{position:relative;display:grid;justify-items:center;gap:4px;font-family:var(--display);font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.lst i{width:22px;height:22px;border-radius:50%;background:var(--surface);border:5px solid var(--line);position:relative;z-index:1}
.lst.part i{border-color:var(--c)}
.lst.done i{border-color:var(--c);background:var(--c)}
.lst.here i{box-shadow:0 0 0 4px color-mix(in srgb,var(--yellow) 55%,transparent)}
.lst.here{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.lst.here i{animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--yellow) 10%,transparent)}}

/* ---------- Vista de ramo ---------- */
.back{border:0;background:transparent;font-weight:700;color:var(--muted);padding:14px 0 0;font-size:15px}
.hero{margin-top:10px;border-radius:18px;background:var(--c);color:#fff;padding:20px;display:grid;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:230px;height:230px;border-radius:50%;border:22px solid rgba(255,255,255,.09)}
.hero .top2{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.hero .badge{background:#fff;color:var(--c);width:60px;height:60px;font-size:26px}
.hero h2{font-size:40px;font-weight:900;text-transform:uppercase}
.hero .meta{font-size:14px;opacity:.92}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;z-index:1}
.nums div{background:rgba(0,0,0,.16);border-radius:10px;padding:8px 10px}
.nums b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.nums span{font-size:12px;opacity:.92}
.dues{display:grid;gap:8px}
.due{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);border-left:6px solid var(--c)}
.due .w{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:78px}
.due.urgent .w{color:var(--bad)}
.due p{margin:0;font-size:14px;flex:1;min-width:0}
.due .btn{padding:8px 12px;font-size:14px}
.next{background:var(--surface);border-radius:16px;padding:18px;display:grid;gap:8px;box-shadow:var(--shadow);border-top:6px solid var(--c)}
.next .k{font-family:var(--display);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.next h3{font-size:32px;font-weight:800}
.next p{margin:0;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px;background:var(--ink);color:var(--bg);justify-self:start}
.btn.c{background:var(--c);color:#fff}
.btn.y{background:var(--yellow);color:#1b1b1b}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.review{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px dashed var(--muted);border-radius:12px;padding:12px 14px;flex-wrap:wrap}
.review p{margin:0;flex:1;font-size:15px;min-width:200px}
.note{font-size:14px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.empty strong{color:var(--ink)}

/* recorrido: tramos por semana, en orden */
.route{position:relative;display:grid;gap:12px}
.leg{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.leg>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.leg>summary::-webkit-details-marker{display:none}
.leg .wk{width:54px;height:54px;border-radius:12px;background:var(--surface2);border:2px solid var(--line);display:grid;place-items:center;text-align:center;line-height:1;font-family:var(--display)}
.leg .wk small{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.leg .wk b{font-size:24px;font-weight:800}
.leg.actual .wk{background:var(--yellow);border-color:var(--yellow);color:#1b1b1b}
.leg.actual .wk small{color:#1b1b1b}
.leg.pasada .wk{opacity:.85}
.leg h3{font-size:24px;font-weight:700}
.leg .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.leg .tog{font-family:var(--display);font-size:22px;color:var(--muted);transition:transform .2s}
.leg[open] .tog{transform:rotate(90deg)}
.leg .body{padding:0 16px 8px}
.weekbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 6px;font-size:14px;color:var(--muted)}
.weekbar .bar{flex:1;min-width:90px}
.weekbar .btn{padding:7px 12px;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .5s}
ol.stations{list-style:none;margin:0;padding:0}
ol.stations li{position:relative;padding:0 0 0 46px}
ol.stations li::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:6px;background:var(--line)}
ol.stations li.done::before{background:var(--c)}
ol.stations li:first-child::before{top:22px}
ol.stations li:last-child::before{bottom:calc(100% - 22px)}
.stop{position:absolute;left:4px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--surface);border:5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
li.done .stop{border-color:var(--c);background:var(--c);color:#fff}
li.next .stop{border-color:var(--yellow);box-shadow:0 0 0 4px color-mix(in srgb,var(--yellow) 35%,transparent)}
@media (prefers-reduced-motion:no-preference){li.next .stop{animation:pulse 1.8s ease-in-out infinite}}
.stationbtn{display:flex;width:100%;text-align:left;gap:10px;align-items:center;justify-content:space-between;border:0;background:transparent;padding:10px 0 14px;border-bottom:1px solid var(--line)}
li:last-child .stationbtn{border-bottom:0}
.stationbtn .nm{font-family:var(--display);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block}
.stationbtn .tt{font-weight:700;display:block}
.stationbtn .rt{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink)}

/* ---------- Reproductor: el viaje ---------- */
.player{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20}
.phead{position:sticky;top:env(safe-area-inset-top,0px);background:var(--board);color:#eef3f0;z-index:2;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.phead .in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.close{border:0;background:transparent;font-size:15px;font-weight:700;color:#9fb0a9;padding:6px 0}
.track{position:relative;height:34px;margin:0 18px}
.track .rail{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:#2a3430}
.track .done{position:absolute;left:0;top:20px;height:6px;border-radius:3px;background:var(--c);transition:width .5s}
.track .sta{position:absolute;top:17px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#2a3430;border:2px solid var(--board)}
.track .sta.on{background:var(--c)}
.track .train{position:absolute;top:0;margin-left:-17px;width:34px;height:22px;transition:left .55s cubic-bezier(.5,.1,.3,1)}
.xpnow{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:var(--led);white-space:nowrap}
.combo{display:inline-block;margin-right:8px;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--yellow);color:#1b1b1b;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.combo.pop{animation:pop .35s ease-out}}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.pbody{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 130px;display:grid;gap:16px}
.kicker{font-family:var(--display);text-transform:uppercase;letter-spacing:2px;color:var(--c);font-size:15px;font-weight:700}
.q{font-size:23px;font-weight:700;line-height:1.3;margin:0}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 14px 14px 16px;text-align:left;font-size:17px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateX(3px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
@media (prefers-reduced-motion:no-preference){.opt.bad{animation:shake .3s}.fb.ok{animation:rise .35s ease-out}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}
.fb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;border-radius:12px;padding:14px;background:var(--surface);box-shadow:var(--shadow)}
.signal{width:30px;height:56px;border-radius:8px;background:#1b1f1e;display:grid;gap:4px;padding:5px;align-content:start}
.signal i{width:20px;height:20px;border-radius:50%;background:#333a38}
.fb.ok .signal i:last-child{background:#2fe08a;box-shadow:0 0 10px #2fe08a}
.fb.bad .signal i:first-child{background:#ff4d40;box-shadow:0 0 10px #ff4d40}
.fb strong{display:block;font-family:var(--display);font-size:23px;text-transform:uppercase;letter-spacing:.5px}
.fb.ok strong{color:var(--ok)}
.fb.bad strong{color:var(--bad)}
.fb p,.fb ol{margin:6px 0 0}
.reading{background:var(--surface);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.reading p{margin:0 0 12px;font-size:18px;max-width:65ch}
.reading p:last-child{margin-bottom:0}
.src{font-size:13px;color:var(--muted);font-style:italic}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:3}
.dock .in{max-width:780px;margin:0 auto;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.dock .in .note{margin-right:auto}
.dock .btn{background:var(--c);color:#fff;padding:13px 22px}
.card3d{perspective:1000px;min-height:230px}
.flip{position:relative;width:100%;min-height:230px;border:0;background:transparent;padding:0;transform-style:preserve-3d;transition:transform .45s}
.flip.on{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:22px;display:grid;place-content:center;text-align:center;gap:8px;background:var(--surface);box-shadow:var(--shadow)}
.face.front{border-top:8px solid var(--c)}
.face.back{transform:rotateY(180deg);background:var(--c);color:#fff}
.face .big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.05;text-transform:uppercase}
.face .hint{font-size:13px;color:var(--muted)}
.face.back p{margin:0;font-size:19px}
.cardnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.order{display:grid;gap:8px}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:10px 12px;min-height:48px;background:var(--surface);text-align:left;width:100%}
.slot b{font-family:var(--display);font-size:22px;width:22px;color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--ink)}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .chip{border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;font-size:15px;font-weight:400;white-space:normal}
.pool .chip:disabled{opacity:.25}
.cls{display:grid;gap:10px}
.clsitem{background:var(--surface);border:2px solid transparent;border-radius:12px;padding:12px;display:grid;gap:8px;box-shadow:var(--shadow)}
.clsitem.ok{border-color:var(--ok)}
.clsitem.bad{border-color:var(--bad)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{border:2px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.cat[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.clsitem .right{font-size:14px;color:var(--bad)}
.taller{display:grid;gap:18px}
.case{background:var(--surface);border-left:6px solid var(--yellow);border-radius:8px;padding:14px;font-size:16px;box-shadow:var(--shadow)}
.tq{background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
.tq h3{font-family:var(--body);font-size:17px;line-height:1.35}
.tq .ind{font-size:13px;color:var(--muted)}
.tq textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);resize:vertical}
.tq details summary{cursor:pointer;font-weight:700;font-size:15px}
.tq ul{margin:6px 0 0;padding-left:20px;font-size:15px}
.tq .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ai{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-radius:10px;padding:12px;font-size:15px;white-space:pre-wrap}
.check{display:grid;gap:8px}
.check label{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--c)}

/* boleto de llegada */
.ticket{justify-self:center;width:min(100%,420px);margin-top:18px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:left}
.ticket .t1{background:var(--c);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ticket .t1 b{font-family:var(--display);font-size:22px;letter-spacing:2px;text-transform:uppercase}
.ticket .t1 span{font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.ticket .t2{padding:16px 18px;display:grid;gap:4px;border-bottom:2px dashed var(--line);position:relative}
.ticket .t2::before,.ticket .t2::after{content:"";position:absolute;bottom:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.ticket .t2::before{left:-10px}.ticket .t2::after{right:-10px}
.ticket .t2 small{font-family:var(--display);letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-size:13px}
.ticket .t2 strong{font-family:var(--display);font-size:28px;text-transform:uppercase;line-height:1.05}
.ticket .score{font-family:var(--display);font-size:76px;font-weight:900;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.ticket .t3{padding:14px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ticket .t3 div{display:grid}
.ticket .t3 small{font-size:12px;color:var(--muted)}
.ticket .t3 b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.ticket .t4{padding:0 18px 16px;font-size:14px;color:var(--muted);display:grid;gap:4px}
@media (prefers-reduced-motion:no-preference){.ticket{animation:print .6s cubic-bezier(.2,.8,.3,1)}}
@keyframes print{from{transform:translateY(-24px);clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (max-width:440px){.brand h1{font-size:34px}.hero h2{font-size:30px}.ramo h3{font-size:23px}.q{font-size:20px}.nums b{font-size:25px}.dest b{font-size:18px}.when b{font-size:19px}.express h3{font-size:25px}.leg h3{font-size:20px}}
.tools{display:flex;flex-wrap:wrap;gap:8px}.tools a.btn{text-decoration:none;display:inline-block}
</style>
</head>
<body>
<div class="edge" aria-hidden="true"></div>
<header class="top">
  <div class="in">
    <div class="brand">
      <div><div class="k" id="st-turno">Turno</div><h1>Turno de estudio</h1></div>
      <div class="stats">
        <div class="stat fire"><b id="st-racha">0</b><span>días de racha</span></div>
        <div class="stat"><b id="st-xp">0</b><span>puntos</span></div>
      </div>
    </div>
    <div class="lvl"><div class="row"><strong id="st-lvl">Aprendiz</strong><span id="st-next">—</span></div><div class="lvlbar"><i id="st-bar"></i></div></div>
  </div>
</header>
<div class="wrap">
  <main id="view"><div class="empty" style="margin-top:20px">Cargando tus ramos…</div></main>
  <p class="note" style="margin-top:28px">Tu avance se guarda en este dispositivo. Para seguir en otro, usa <strong>Copiar respaldo</strong> aquí y <strong>Restaurar respaldo</strong> allá.</p>
  <div id="local-tools"></div>
</div>

<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="Misión">
  <div class="phead"><div class="in"><button class="close" id="p-close">✕ Salir</button><div class="track" id="p-track" aria-hidden="true"></div><span class="xpnow"><span class="combo" id="p-combo" hidden></span><span id="p-xp">+0</span></span></div></div>
  <div class="pbody" id="p-body"></div>
  <div class="dock"><div class="in"><span class="note" id="p-note"></span><button class="btn" id="p-next" disabled>Continuar</button></div></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="datos.js?v=28784ea636"></script>
<script src="local.js?v=fcb99b470f"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NIVELES=[[0,"Aprendiz"],[150,"Brigadista"],[400,"Monitor de seguridad"],[800,"Supervisor"],[1500,"Prevencionista"],[2600,"Jefe de prevención"]];
const fecha=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hoy=()=>fecha(new Date());
const ayer=()=>{const d=new Date();d.setDate(d.getDate()-1);return fecha(d)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const oscuro=()=>{const t=document.documentElement.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
const TREN='<svg viewBox="0 0 34 22" width="34" height="22" aria-hidden="true"><rect x="1" y="2" width="30" height="15" rx="5" fill="#f3c300"/><path d="M31 6h2v8h-2z" fill="#f3c300"/><rect x="5" y="5" width="6" height="5" rx="1" fill="#0c100f"/><rect x="13" y="5" width="6" height="5" rx="1" fill="#0c100f"/><rect x="21" y="5" width="7" height="5" rx="1" fill="#0c100f"/><circle cx="8" cy="19" r="2.4" fill="#e6ede9"/><circle cx="24" cy="19" r="2.4" fill="#e6ede9"/></svg>';

let db=null, sample=null, semanas=[], prog=null, ramos=[];
const PROG_PATH="progreso/osvaldo";
const blank=()=>({xp:0,racha:0,ultimoDia:"",misiones:{},preguntas:{},notas:{},checks:{},repasos:{},desafios:{}});
const PALETA=["#0a7a4b","#1d5fc4","#c2501b","#7a3db8","#a8365b"];

function listaRamos(){
  // ramos definidos en config/ramos; si falta alguno, se deduce de las semanas cargadas
  const out=ramos.slice();
  semanas.forEach(s=>{if(!out.find(r=>r.codigo===s.codigo))out.push({codigo:s.codigo,nombre:s.curso,linea:"L"+(out.length+1)})});
  out.forEach((r,i)=>{if(!r.color)r.color=PALETA[i%PALETA.length]});
  return out;
}
function ramoDe(cod){return listaRamos().find(r=>r.codigo===cod)}
function colorDe(cod){const r=ramoDe(cod);if(!r)return PALETA[0];return (oscuro()&&r.colorOscuro)||r.color}

/* ---------- Guardado ---------- */
let saving=false, dirty=false;
async function save(){
  if(!db)return;
  if(saving){dirty=true;return}
  saving=true;
  try{await db.doc(PROG_PATH).set(JSON.parse(JSON.stringify(prog)))}
  catch(e){toast(e&&e.code==="quota_exceeded"?"No hay espacio para guardar el avance":"No se pudo guardar; se reintentará")}
  saving=false;
  if(dirty){dirty=false;save()}
}
let noteTimer=null;
function saveSoon(){clearTimeout(noteTimer);noteTimer=setTimeout(save,1200)}
function ganar(xp){
  if(!xp)return;
  const h=hoy();
  if(prog.ultimoDia!==h){prog.racha=(prog.ultimoDia===ayer())?(prog.racha||0)+1:1;prog.ultimoDia=h}
  prog.xp=(prog.xp||0)+xp;
  sesionXP+=xp; $("#p-xp").textContent="+"+sesionXP;
}
async function copiar(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(e){return false}
}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2600)}

/* ---------- Cálculos ---------- */
function nivel(xp){let cur=NIVELES[0],nx=null;for(let i=0;i<NIVELES.length;i++){if(xp>=NIVELES[i][0]){cur=NIVELES[i];nx=NIVELES[i+1]||null}}return{cur,nx}}
const misKey=(s,m)=>s.id+"/"+m.id;
const et=s=>s.etiqueta||"Semana";
const corto=s=>(s.etiqueta?"L":"S")+s.semana;
// todas las semanas de un ramo, en orden cronológico (S1, S2, S3…)
const cronologico=l=>l.slice().sort((a,b)=>(a.desde||"").localeCompare(b.desde||"")||((a.semana||0)-(b.semana||0)));
const semDe=cod=>cronologico(semanas.filter(s=>s.codigo===cod));
// estado de una semana según la fecha: "actual", "prox" (todavía no empieza) o "pasada"
function estado(s){const h=hoy();if(s.desde&&s.desde>h)return"prox";if(s.hasta&&s.hasta<h)return"pasada";return"actual"}
// prioridad para "sigue aquí": lo de esta semana, luego lo que viene y al final lo pasado
function ordenSem(lista){const g={actual:0,prox:1,pasada:2};return lista.slice().sort((a,b)=>{const ea=estado(a),eb=estado(b);if(ea!==eb)return g[ea]-g[eb];return ea==="pasada"?(b.desde||"").localeCompare(a.desde||""):(a.desde||"").localeCompare(b.desde||"")})}
const fmtDia=d=>new Date(d+"T12:00").toLocaleDateString("es-CL",{weekday:"short",day:"numeric",month:"short"});
const fmtRango=s=>s.desde&&s.hasta?new Date(s.desde+"T12:00").toLocaleDateString("es-CL",{day:"numeric",month:"short"})+" – "+new Date(s.hasta+"T12:00").toLocaleDateString("es-CL",{day:"numeric",month:"short"}):"";
function evaluables(s){const out=[];(s.misiones||[]).forEach(m=>(m.pasos||[]).forEach(p=>{if(p.id&&(p.t==="mc"||p.t==="orden"||p.t==="clasificar"))out.push({s,m,p})}));return out}
function dominio(s){const q=evaluables(s),P=prog.preguntas||{};if(!q.length)return null;return Math.round(q.filter(x=>{const r=P[x.p.id];return r&&r.ok>0&&!r.pend}).length/q.length*100)}
// repetición espaciada simple: primero lo fallado, luego lo nunca visto, luego lo que lleva más días sin repasar
function priorizar(items){
  const P=prog.preguntas||{},now=Date.now();
  return items.map(x=>{const r=P[x.p.id];let w;
    if(!r)w=50;else if(r.pend)w=100;else{const dias=r.ultima?Math.max(0,(now-Date.parse(r.ultima+"T12:00"))/86400000):30;w=Math.min(dias,30)+(r.fallos||0)*4}
    return{x,w:w+Math.random()*12}}).sort((a,b)=>b.w-a.w).map(o=>o.x);
}
function mazo(sems,n){const c=[];sems.forEach(s=>(s.misiones||[]).forEach(m=>(m.pasos||[]).forEach(p=>{if(p.t==="tarjetas")(p.cartas||[]).forEach(x=>c.push(x))})));return shuffle(c).slice(0,n)}
const poolDesafio=()=>semanas.filter(s=>estado(s)!=="prox").flatMap(evaluables);
const hechasDe=s=>(s.misiones||[]).filter(m=>(prog.misiones[misKey(s,m)]||{}).hecha).length;
function siguiente(cod){
  const lista=ordenSem(cod?semDe(cod):semanas);
  for(const s of lista)for(const m of s.misiones||[])if(!(prog.misiones[misKey(s,m)]||{}).hecha)return{s,m};
  return null;
}
function fallos(cod){
  const out=[],P=prog.preguntas||{};
  semanas.filter(s=>!cod||s.codigo===cod).forEach(s=>(s.misiones||[]).forEach(m=>(m.pasos||[]).forEach(p=>{if(p.id&&P[p.id]&&P[p.id].pend)out.push({s,m,p})})));
  return out;
}
function resumen(cod){
  let total=0,hechas=0,ok=0,q=0;
  semDe(cod).forEach(s=>(s.misiones||[]).forEach(m=>{total++;const st=prog.misiones[misKey(s,m)]||{};if(st.hecha){hechas++;ok+=st.ok||0;q+=st.total||0}}));
  return{total,hechas,pct:q?Math.round(ok/q*100):null};
}
function entregas(cod){
  const now=Date.now(),out=[];
  semanas.filter(s=>!cod||s.codigo===cod).forEach(s=>(s.entregas||[]).forEach(e=>{const t=Date.parse(e.vence);if(!isNaN(t)&&t>now-6*3600000)out.push({s,e,t})}));
  return out.sort((a,b)=>a.t-b.t);
}
function fmtFalta(ms){
  if(ms<=0)return"Hoy";
  const h=Math.floor(ms/3600000),d=Math.floor(h/24);
  if(d>=1)return d+" d "+(h%24)+" h";
  return h+" h "+Math.floor((ms%3600000)/60000)+" m";
}
const fmtFecha=t=>new Date(t).toLocaleString("es-CL",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false});
const hora=()=>new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit",hour12:false});
function turnoActual(){const h=new Date().getHours();return h<6?"Turno de noche":h<14?"Turno de mañana":h<22?"Turno de tarde":"Turno de noche"}

/* ---------- Vistas ---------- */
function renderStats(){
  const p=prog||blank();
  let racha=p.racha||0; if(p.ultimoDia!==hoy()&&p.ultimoDia!==ayer())racha=0;
  $("#st-racha").textContent=racha;
  $("#st-xp").textContent=(p.xp||0).toLocaleString("es-CL");
  $("#st-turno").textContent=turnoActual()+" · "+new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"});
  const {cur,nx}=nivel(p.xp||0);
  $("#st-lvl").textContent=cur[1];
  if(nx){$("#st-bar").style.width=Math.round(((p.xp-cur[0])/(nx[0]-cur[0]))*100)+"%";$("#st-next").textContent=(nx[0]-p.xp)+" pts para "+nx[1]}
  else{$("#st-bar").style.width="100%";$("#st-next").textContent="Nivel máximo"}
}
// tablero de salidas: entregas próximas y la siguiente estación de cada ramo
function tablero(){
  const filas=[];
  entregas(null).filter(x=>x.t-Date.now()<21*86400000).forEach(x=>{
    const r=ramoDe(x.s.codigo)||{};const falta=x.t-Date.now();
    const m=x.e.mision&&(x.s.misiones||[]).find(mm=>mm.id===x.e.mision);
    filas.push({r,cod:x.s.codigo,dest:x.e.nombre,sub:(r.corto||r.nombre||x.s.curso)+" · cierra "+fmtFecha(x.t),when:fmtFalta(falta),st:falta<2*86400000?["Última llamada","last"]:falta<7*86400000?["Prepárate",""]:["A tiempo",""],go:()=>m?abrir(x.s,m):(location.hash=x.s.codigo.toLowerCase())});
  });
  listaRamos().forEach(r=>{
    const nx=siguiente(r.codigo); if(!nx)return;
    const est=estado(nx.s);
    filas.push({r,cod:r.codigo,dest:corto(nx.s)+" · "+nx.m.estacion,sub:nx.m.titulo+" · "+(nx.m.minutos||5)+" min",when:est==="prox"?fmtDia(nx.s.desde):"Ahora",st:est==="prox"?["Adelanta",""]:est==="pasada"?["Pendiente",""]:["Embarcando","go"],go:()=>abrir(nx.s,nx.m)});
  });
  const b=document.createElement("div");b.className="board";
  b.innerHTML=`<div class="bhead"><span>Próximas salidas</span><span class="clock" id="reloj">${esc(hora())}</span></div>`;
  if(!filas.length)b.insertAdjacentHTML("beforeend",`<div class="bempty">Sin salidas pendientes · Al día ✓</div>`);
  filas.forEach(f=>{
    const row=document.createElement("button");row.className="brow";row.style.setProperty("--c",colorDe(f.cod));
    row.innerHTML=`<span class="lb">${esc(f.r.linea||"")}</span><span class="dest"><b>${esc(f.dest)}</b><span>${esc(f.sub)}</span></span><span class="when"><b>${esc(f.when)}</b><span class="${f.st[1]}">${esc(f.st[0])}</span></span>`;
    row.onclick=f.go;b.appendChild(row);
  });
  return b;
}
function mapaLinea(cod){
  const sems=semDe(cod);if(!sems.length)return "";
  const n=sems.length;let hasta=-1;
  const st=sems.map((s,i)=>{const t=(s.misiones||[]).length,h=hechasDe(s);if(h>0)hasta=i;
    const cls=[t&&h===t?"done":h?"part":"",estado(s)==="actual"?"here":""].join(" ");
    return `<span class="lst ${cls}" title="${esc(et(s)+" "+s.semana+": "+s.titulo)}"><i></i>${esc(corto(s))}</span>`}).join("");
  const w=hasta<0?0:(n===1?100:hasta/(n-1)*100);
  return `<span class="lmap" style="--n:${n}"><span class="fill" style="width:calc((100% - 24px) * ${w/100})"></span>${st}</span>`;
}
function vistaInicio(){
  const v=$("#view"); v.innerHTML="";
  document.documentElement.style.setProperty("--c","#141c18");
  const sb=document.createElement("section");sb.className="block";sb.appendChild(tablero());v.appendChild(sb);
  const pool=poolDesafio();
  if(pool.length>=4){
    const dsec=document.createElement("section");dsec.className="block";
    const hecho=(prog.desafios||{})[hoy()];
    const fallas=fallos(null).length;
    const d=document.createElement("div");d.className="express";
    d.innerHTML=`<div><span class="k">Servicio expreso · desafío del día</span><h3>${hecho===undefined?"8 preguntas, todos tus ramos":"Expreso de hoy completado ✓"}</h3>
      <p>${hecho===undefined?`Mezcla semanas actuales y pasadas. Primero salen las que fallaste${fallas?` (tienes ${fallas})`:""} y las que no repasas hace tiempo. Encadena aciertos para sumar combo. <strong>Bono +30</strong> una vez al día.`:`Hoy sacaste ${hecho} %. Puedes jugar otra ronda sin bono, o volver mañana por uno nuevo.`}</p></div>`;
    const b=document.createElement("button");b.className="btn y";b.textContent=hecho===undefined?"Abordar":"Otra ronda";b.onclick=abrirDesafio;d.appendChild(b);
    dsec.appendChild(d);v.appendChild(dsec);
  }

  p.preguntas.forEach(q=>{
    const ta=$("#ta-"+q.id), cnt=$("#cnt-"+q.id), out=$("#out-"+q.id), bt=$("#ai-"+q.id);
    ta.value=prog.notas[key(q.id)]||"";
    const upd=()=>{const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;cnt.textContent=n+" palabras"};upd();
    ta.oninput=()=>{prog.notas[key(q.id)]=ta.value;upd();saveSoon()};
    const prev=prog.notas[key(q.id)+"#ai"]; if(prev){out.hidden=false;out.textContent=prev}
    // sin revisión integrada (web o APK), el botón copia el pedido completo para pegarlo en Claude
    if(!sample)bt.textContent="Copiar para revisar en Claude";
    bt.onclick=async()=>{
      if(ta.value.trim().split(/\s+/).length<25){toast("Escribe al menos unas 25 palabras para revisar");return}
      const prompt=`Eres docente de la asignatura "${s.curso||"de la carrera"}" (IACC, Chile, Técnico en Prevención de Riesgos). Un estudiante prepara el borrador de una tarea. Tu trabajo es darle retroalimentación formativa, NO escribir la respuesta por él (la tarea debe ser elaboración propia).
${p.ia?`
REGLA DE USO DE IA DE ESTA TAREA: ${p.ia}
Respétala estrictamente: no calcules ni sugieras valores numéricos del caso, no construyas tablas y no interpretes los datos por él. Solo dile si su borrador cubre todo lo que pide la pregunta, si usa bien los conceptos y si explica su procedimiento.
`:""}
CASO: ${p.caso}

PREGUNTA: ${q.p}
INDICADOR DE EVALUACIÓN: ${q.indicador}
Escala de la rúbrica: 4 = de forma correcta; 3 = de forma general; 2 = de forma parcial; 1 = presenta dificultad; 0 = no responde.
Contenidos de la semana que se espera usar: ${q.pistas.join("; ")}.

BORRADOR DEL ESTUDIANTE:
"""${ta.value.trim().slice(0,6000)}"""

Responde en español de Chile, cercano y directo, en texto plano (sin markdown, sin asteriscos), con este formato exacto:
Nivel estimado: N de 4, en una frase por qué.
Lo que está bien: 1 o 2 puntos breves.
Lo que falta: 2 a 4 puntos concretos, en forma de pregunta o pista (no redactes la respuesta).
Términos técnicos que podrías usar: 3 a 5 palabras.
Máximo 170 palabras.`;
      if(!sample){
        const ok=await copiar(prompt);
        out.hidden=false;
        out.textContent=ok?"Copiado. Abre Claude (claude.ai o la app), pega el texto y envíalo: te dirá qué le falta a tu borrador según la rúbrica, sin escribirlo por ti.":"No se pudo copiar automáticamente. Mantén presionado este texto para copiarlo:\n\n"+prompt;
        return;
      }
      bt.disabled=true; out.hidden=false; out.textContent="Revisando…";
      try{
        const r=await sample(prompt,{onText:({text})=>{out.textContent=text},cache:false});
        out.textContent=r.text; prog.notas[key(q.id)+"#ai"]=r.text;
        const flag=key(q.id)+"#xp"; if(!prog.notas[flag]){prog.notas[flag]="1";ganar(20)} save();
      }catch(e){
        if(e&&e.code==="not_granted"){out.textContent="La revisión con Claude no está habilitada en esta vista.";sample=null}
        else if(e&&e.code==="rate_limited"){out.textContent="Demasiadas revisiones seguidas. Espera un par de minutos."}
        else out.textContent="No se pudo revisar ahora. Inténtalo de nuevo en un rato.";
      }
      bt.disabled=false;
    };
  });
  p.checklist.forEach((_,i)=>{const c=$("#ck-"+i);const k=key("ck"+i);c.checked=!!prog.checks[k];c.onchange=()=>{prog.checks[k]=c.checked;saveSoon()}});
  setNext("Terminar taller",()=>{totalQ=0;avanzar()});
}
function fin(){
  via(true); body.innerHTML=""; note.textContent="";
  let titulo="Misión cumplida", destino=actual&&actual.m?actual.m.titulo:"", extra="";
  const pct=totalQ?Math.round(aciertos/totalQ*100):null;
  if(modo==="mision"&&actual){
    const k=misKey(actual.s,actual.m); const prev=prog.misiones[k]||{};
    if(!prev.hecha)ganar(25);
    prog.misiones[k]={hecha:true,ok:Math.max(aciertos,prev.ok||0),total:totalQ||prev.total||0,fecha:hoy()};
    titulo="Llegada · "+corto(actual.s);destino=actual.m.estacion+": "+actual.m.titulo;
  }else if(modo==="relampago"&&actual){
    titulo="Relámpago · "+corto(actual.s);destino=actual.s.titulo;
    prog.repasos=prog.repasos||{}; prog.repasos[actual.s.id]={fecha:hoy(),pct};
    extra=`Dominio de ${et(actual.s).toLowerCase()} ${actual.s.semana}: <strong>${dominio(actual.s)} %</strong>.`;
  }else if(modo==="desafio"){
    titulo="Expreso del día";destino="Todos tus ramos";
    prog.desafios=prog.desafios||{};
    const h=hoy();
    if(prog.desafios[h]===undefined){ganar(30);extra="Bono diario: <strong>+30</strong>."}
    prog.desafios[h]=Math.max(pct||0,prog.desafios[h]||0);
    // guardar solo los últimos 30 días
    Object.keys(prog.desafios).sort().slice(0,-30).forEach(x=>delete prog.desafios[x]);
  }else{titulo="Repaso";destino="Preguntas falladas"}
  const {cur}=nivel(prog.xp||0);
  const d=document.createElement("div");d.className="ticket";
  d.innerHTML=`<div class="t1"><b>${esc(titulo)}</b><span>${esc(new Date().toLocaleDateString("es-CL"))} · ${esc(hora())}</span></div>
    <div class="t2"><small>Destino</small><strong>${esc(destino)}</strong><span class="score">+${sesionXP}</span><small>puntos</small></div>
    <div class="t3"><div><small>Aciertos</small><b>${pct===null?"—":aciertos+"/"+totalQ}</b></div><div><small>Mejor combo</small><b>${mejorCombo>=2?"×"+mejorCombo:"—"}</b></div><div><small>Racha</small><b>${prog.racha||1} ${prog.racha===1?"día":"días"}</b></div></div>
    <div class="t4"><span>Nivel: <strong>${esc(cur[1])}</strong></span>${extra?`<span>${extra}</span>`:""}${pct!==null&&pct<100?`<span>Lo que fallaste quedó en tu repaso.</span>`:""}</div>`;
  body.appendChild(d);
  save();
  const nx=modo==="mision"&&actual?siguiente(actual.s.codigo):null;
  if(nx){setNext("Siguiente estación →",()=>abrir(nx.s,nx.m));note.textContent="O sal con ✕ y sigue mañana"}
  else if(modo==="relampago"&&actual){const s0=actual.s;setNext("Otra ronda",()=>abrirRelampago(s0));note.textContent="Las preguntas cambian en cada ronda"}
  else setNext("Volver al tablero",cerrar);
}

/* ---------- Arranque ---------- */
async function start(){
  const timer=setTimeout(()=>{if(!semanas.length)$("#view").innerHTML=`<div class="empty" style="margin-top:20px">No se pudo conectar con tus datos todavía. Revisa tu conexión; la página seguirá intentando.</div>`},10000);
  try{db=await claude.use("db")}catch(e){db=null}
  try{sample=await claude.use("sample")}catch(e){sample=null}
  if(!db){clearTimeout(timer);$("#view").innerHTML=`<div class="empty" style="margin-top:20px">Abre esta página con tu sesión de Claude iniciada para ver tus ramos y guardar tu avance.</div>`;return}
  let got={p:false,s:false,r:false};
  const ready=()=>{if(got.p&&got.s&&got.r){clearTimeout(timer);if(player.hidden)renderAll();else renderStats()}};
  db.doc(PROG_PATH).onSnapshot(snap=>{
    if(snap.exists&&!saving&&!snap.metadata.hasPendingWrites)prog=Object.assign(blank(),JSON.parse(JSON.stringify(snap.data()||{})));
    got.p=true;ready();
  },()=>{got.p=true;ready()});
  db.doc("config/ramos").onSnapshot(snap=>{
    ramos=(snap.exists&&Array.isArray((snap.data()||{}).ramos))?JSON.parse(JSON.stringify(snap.data().ramos)):[];
    got.r=true;ready();
  },()=>{got.r=true;ready()});
  db.collection("semanas").onSnapshot(q=>{
    semanas=q.docs.map(d=>d.data()).filter(x=>x&&Array.isArray(x.misiones));
    got.s=true;ready();
  },()=>{got.s=true;clearTimeout(timer);$("#view").innerHTML=`<div class="empty" style="margin-top:20px">No se pudieron cargar las misiones. Recarga la página en un rato.</div>`});
  setInterval(()=>{if(player.hidden&&got.s)renderAll()},60000);
  setInterval(()=>{const r=document.getElementById("reloj");if(r)r.textContent=hora()},15000);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(player.hidden)renderAll()});
}
prog=blank(); renderStats();
let espera=0;
(function boot(){
  if(window.claude&&typeof window.claude.use==="function"){start();return}
  if(++espera>40){$("#view").innerHTML=`<div class="empty" style="margin-top:20px">Abre esta página desde Claude para ver tus ramos.</div>`;return}
  setTimeout(boot,250);
})();
})();
</script>
